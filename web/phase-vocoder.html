<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manifold authored phase vocoder</title>
  <style>
    :root { color-scheme: dark; font: 16px system-ui, sans-serif; background: #10131c; color: #eeedf5; }
    body { max-width: 860px; margin: 3rem auto; padding: 0 1.25rem; }
    h1 { line-height: 1.15; }
    section { background: #1d2230; border-radius: 12px; padding: 1.25rem; margin-block: 1rem; }
    button { background: #7663d8; border: 0; border-radius: 7px; color: white; padding: .7rem 1rem; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    label { display: flex; align-items: center; gap: 1rem; margin-block: 1rem; }
    label span { min-width: 7rem; }
    input { flex: 1; }
    output { min-width: 3.5rem; text-align: right; }
    #status { color: #9bd6ae; }
    pre { max-height: 26rem; overflow: auto; background: #0c0e15; border-radius: 8px; padding: 1rem; font-size: .72rem; }
  </style>
</head>
<body>
  <h1>Phase vocoder from a public graph</h1>
  <p>A 440 Hz test oscillator feeds the reusable Rust phase vocoder. Change the pitch and wet mix while it plays. The same authored graph loads in browser and native hosts.</p>
  <section>
    <button id="start">Start audio</button>
    <button id="stop" disabled>Stop</button>
    <label><span>Pitch</span><input id="pitch" type="range" min="-24" max="24" step="1" value="12" disabled><output id="pitch-value">+12 st</output></label>
    <label><span>Wet mix</span><input id="mix" type="range" min="0" max="1" step="0.01" value="1" disabled><output id="mix-value">100%</output></label>
    <p id="status" role="status">Ready to start.</p>
  </section>
  <section><h2>Saved portable graph</h2><pre id="project"></pre></section>
  <script type="module" src="/src/phase-vocoder.js"></script>
</body>
</html>
