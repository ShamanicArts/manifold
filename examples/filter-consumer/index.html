<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Standalone Filter · Manifold library</title>
<style>body{font:15px system-ui;background:#0b111b;color:#dae1f0;max-width:680px;margin:40px auto;padding:16px}button,select{font:inherit;background:#1b2637;color:#e3eaf6;border:1px solid #354259;border-radius:4px;padding:8px}section{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;background:#14182b;border:1px solid #35435e;border-radius:8px}#filter-graph{width:100%;height:220px;touch-action:none}.controls{display:grid;align-content:start;gap:16px}.slider{height:26px}.slider canvas{width:100%;height:100%}h1{font-size:24px}p{color:#a5b4d3}nav{display:flex;gap:8px;margin:20px 0}a{color:#a78bfa}[hidden]{display:none!important}</style></head>
<body><h1>Standalone Filter</h1><p>An independent application importing Manifold's graph runtime and retained UI kit.</p><nav><button id="start">Start audio</button><button id="add">Add output level live</button><button id="save">Export project</button></nav><section><canvas id="filter-graph"></canvas><div class="controls"><select id="filter-mode"><option value="0">Low pass</option><option value="1">Band pass</option><option value="2">High pass</option><option value="3">Notch</option></select><div class="slider" id="filter-cutoff"></div><div class="slider" id="filter-resonance"></div><div class="slider" id="level" hidden></div></div></section><p id="status">Ready</p><p><a href="/filter.html">Open the Manifold creator</a></p><script type="module" src="/src.js"></script></body></html>
